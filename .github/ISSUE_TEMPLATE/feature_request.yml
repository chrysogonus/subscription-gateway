name: Feature request
description: Suggest a capability or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project is a localhost-first compatibility layer over the user's *own* authenticated
        Codex and Claude Code clients. Proposals that require reading provider credentials,
        intercepting provider traffic, calling undocumented endpoints, or supporting multi-user
        hosting or subscription resale are out of scope and will be closed.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the gateway makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the gateway do? Include the request/response shape if it is an API change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, and why they were not enough.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require reading, parsing, or storing provider credentials.
          required: true
        - label: This does not depend on undocumented or private provider endpoints.
          required: true
