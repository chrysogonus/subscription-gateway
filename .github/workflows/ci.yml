name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project
        run: uv sync --all-extras --frozen --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src/subscription_gateway

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage (Python ${{ matrix.python-version }})'
            echo '```'
            uv run coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Compose file
        run: docker compose config --quiet

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sub2api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if the gateway and both bundled provider CLIs
      # actually resolve on PATH. No credentials are mounted and no provider
      # request is made.
      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint subscription-gateway sub2api:ci --version
          docker run --rm --entrypoint sh sub2api:ci -c '
            set -eux
            command -v codex
            command -v claude
            timeout 60 codex --version
            timeout 60 claude --version
          '
