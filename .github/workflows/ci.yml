name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml so a tag runs exactly the gate that main runs.
  workflow_call:

permissions:
  contents: read

# github.workflow is the *caller's* name inside a called workflow, so a Release
# run and a CI run on the same commit never share a group. Only superseded pull
# request runs are worth cancelling; a main or tag run is allowed to finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Style and types do not vary by interpreter: ruff pins target-version and
  # mypy pins python_version in pyproject.toml. Running them once, on the
  # version those settings name, is the whole check.
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project
        run: uv sync --all-extras --frozen --python 3.12

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      # Target comes from [tool.mypy] packages in pyproject.toml.
      - name: Type-check
        run: uv run mypy

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project
        run: uv sync --all-extras --frozen --python ${{ matrix.python-version }}

      - name: Test
        run: uv run pytest --cov

      # Only for the version the image ships, so the summary carries one
      # meaningful number. It still runs when the tests fail, but not when the
      # install did, which would leave an empty block behind.
      - name: Coverage summary
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        run: |
          {
            echo '### Coverage (Python ${{ matrix.python-version }})'
            echo '```'
            uv run coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Compose file
        run: docker compose config --quiet

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sub2api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if the gateway and both bundled provider CLIs
      # actually resolve on PATH. No credentials are mounted and no provider
      # request is made.
      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint subscription-gateway sub2api:ci --version
          docker run --rm --entrypoint sh sub2api:ci -c '
            set -eux
            command -v codex
            command -v claude
            timeout 60 codex --version
            timeout 60 claude --version
          '
