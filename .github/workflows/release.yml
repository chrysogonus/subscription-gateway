name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The release gate is the CI workflow itself, at this tag's commit, so a tag
  # cannot ship having passed a weaker set of checks than main did.
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: publish GitHub Release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # The tag must match the version in pyproject.toml, or the release would
      # ship artifacts named after a different version than the tag.
      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run --no-project --with tomli python -c \
            'import tomli;print(tomli.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"

      - name: Build the wheel and sdist
        run: uv build

      - name: Extract the changelog section
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for ${GITHUB_REF_NAME}." > release-notes.md
          fi
          cat release-notes.md

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: true
