name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The release gate is the CI workflow itself, at this tag's commit, so a tag
  # cannot ship having passed a weaker set of checks than main did.
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: publish GitHub Release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # The tag must match the version in pyproject.toml, or the release would
      # ship artifacts named after a different version than the tag.
      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run --no-project --with tomli python -c \
            'import tomli;print(tomli.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"

      - name: Build the wheel and sdist
        run: uv build

      - name: Extract the changelog section
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for ${GITHUB_REF_NAME}." > release-notes.md
          fi
          cat release-notes.md

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: true
