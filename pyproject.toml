[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "subscription-llm-gateway"
version = "0.2.3"
description = "Local OpenAI-compatible gateway for authenticated Codex and Claude Code clients"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Christopher Filsinger", email = "christopher.filsinger@googlemail.com" },
]
keywords = [
  "openai-compatible",
  "llm",
  "gateway",
  "codex",
  "claude-code",
  "fastapi",
  "openwebui",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
subscription-gateway = "subscription_gateway.cli:main"

[project.urls]
Homepage = "https://github.com/chrysogonus/subscription-gateway"
Repository = "https://github.com/chrysogonus/subscription-gateway"
Issues = "https://github.com/chrysogonus/subscription-gateway/issues"
Changelog = "https://github.com/chrysogonus/subscription-gateway/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/subscription_gateway"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A warning the suite does not fail on is a warning nobody reads. Every
# exception below names the dependency that emits it, so it expires visibly.
filterwarnings = [
  "error",
  # starlette.testclient still imports httpx and warns about it; the fix is
  # upstream (httpx2) and not ours to make.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# S (flake8-bandit) is the ruleset aimed at this project's threat model:
# subprocess execution and path handling.
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF", "PT", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, bind test servers, and build fixture paths from literals.
# ASYNC110/240: an async test may poll a real child process and touch the
# filesystem synchronously; that is the thing under test, not a mistake.
"tests/**" = ["S101", "S104", "S108", "ASYNC110", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests"]
explicit_package_bases = true

[tool.coverage.run]
source = ["src/subscription_gateway"]
branch = true

[tool.coverage.report]
show_missing = true
# Ratchet: raise this with the coverage it protects, never lower it to make a
# red run green.
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
