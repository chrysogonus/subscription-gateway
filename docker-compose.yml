services:
  gateway:
    build:
      context: .
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.149.0}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.226}
        GATEWAY_UID: ${GATEWAY_UID:-1000}
        APP_VERSION: ${APP_VERSION:-dev}
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-local}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_ALLOW_REMOTE: "true"
      GATEWAY_SQLITE_PATH: /data/gateway.db
      SUBSCRIPTION_GATEWAY_CONFIG: /etc/subscription-gateway/config.yaml
    ports:
      - "127.0.0.1:11435:11435"
    volumes:
      - gateway-data:/data
      # Model catalog and other settings. The default must be a file that always
      # exists: Docker creates a directory for a missing bind source, and the
      # gateway then refuses to start. Environment variables above still win.
      - ${GATEWAY_CONFIG_FILE:-./config.example.yaml}:/etc/subscription-gateway/config.yaml:ro
      - ${HOST_CODEX_HOME:-${HOME}/.codex}:/home/gateway/.codex:rw
      - ${HOST_CLAUDE_HOME:-${HOME}/.claude}:/home/gateway/.claude:rw
      - ${HOST_CLAUDE_CONFIG:-${HOME}/.claude.json}:/home/gateway/.claude.json:rw
      - ${GATEWAY_WORKSPACE:-${HOME}/workspace}:/home/gateway/workspace:rw
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  open-webui:
    # Optional chat UI. It only starts when the "webui" profile is selected,
    # through `make up-webui`, `docker compose --profile webui up`, or a
    # persistent COMPOSE_PROFILES=webui in .env.
    profiles:
      - webui
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:-v0.11.0-slim}
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      DEFAULT_MODEL_PARAMS: '{"function_calling":"legacy"}'
      OPENAI_API_BASE_URL: http://gateway:11435/v1
      OPENAI_API_KEY: ${GATEWAY_API_KEY:-local}
      WEBUI_NAME: Subscription LLM Gateway
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3001}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  gateway-data:
  open-webui-data:
